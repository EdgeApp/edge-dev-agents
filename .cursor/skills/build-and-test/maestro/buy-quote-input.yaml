# Interaction-only companion to buy-quote.yaml: login -> Buy scene -> enter the
# fiat amount. The Buy scene opens with one deep link,
# `edge://exchange/buy?buyAsset=..`.
# PARAMS:
#   PIN_DIGIT, EXPECT_USERNAME  see common/login-if-needed.yaml. On iOS pass
#                `xcuitest-run.sh --login-role <role>` and neither param.
#   BUY_AMOUNT   fiat amount typed. Default 500.
#   BUY_ASSET    deep-link asset: a plugin id or `<pluginId>_<tokenId>`.
#                Default bitcoin.
#   MANUAL_PATH  "true" taps the Buy tab instead of the link and leaves the
#                asset as the app has it: for a task whose change is on the tab
#                bar or the Buy entry.
#   FIAT_CODE    fiat code the amount field must show ("USD", "EUR"). The field
#                reads "Amount <code>" and the code follows the account's ramp
#                region. Unset, any code passes.
# ENDINGS NAMED: the launch wait ends on the PIN scene, the tab bar (YOLO
# auto-login already done) or the full login scene (nobody signed in: the flow
# fails within 1s). The Buy scene wait ends on the amount form or on "Select
# your region" (an account with no ramp region: the flow fails within 1s; set
# one with common/ramp-set-region-fiat.yaml).
# Captures nothing — capture-buy-quote.sh grabs the proof screenshot externally
# (see that script for why an external burst beats an in-flow screenshot on this build).
appId: ${APP_ID}
env:
  APP_ID: co.edgesecure.app
  PIN_DIGIT: ${PIN_DIGIT || "1"}
  EXPECT_USERNAME: ${EXPECT_USERNAME || ""}
  BUY_AMOUNT: ${BUY_AMOUNT || "500"}
  BUY_ASSET: ${BUY_ASSET || "bitcoin"}
  MANUAL_PATH: ${MANUAL_PATH || ""}
  FIAT_CODE: ${FIAT_CODE || "[A-Z]+"}
---
- launchApp
- extendedWaitUntil:
    visible: "Exit PIN|Create account|Buy"
    timeout: 40000
- extendedWaitUntil:
    notVisible: "Create account"
    timeout: 1000
# YOLO auto-login can finish mid-entry, so the taps go through the gated
# login-if-needed flow instead of four unconditional taps. It ends on its own
# check that the PIN scene is gone.
- runFlow:
    file: common/login-if-needed.yaml
    env:
      PIN_DIGIT: ${PIN_DIGIT}
      EXPECT_USERNAME: ${EXPECT_USERNAME}
      HOME_MARKER: "Buy"
- extendedWaitUntil:
    visible: "Buy"
    timeout: 30000
- runFlow: common/dismiss-startup-modals.yaml
- runFlow:
    when:
      true: ${MANUAL_PATH != 'true'}
    commands:
      - openLink: "edge://exchange/buy?buyAsset=${BUY_ASSET}"
      - extendedWaitUntil:
          visible: "Amount [A-Z]+|Select your region"
          timeout: 30000
# The tab bar stays hidden for up to ~20s after login while "Buy" is already
# in the hierarchy, so a single tap can land on nothing. Retry until the Buy
# scene shows.
- runFlow:
    when:
      true: ${MANUAL_PATH == 'true'}
    commands:
      - retry:
          maxRetries: 3
          commands:
            - tapOn: "Buy"
            - extendedWaitUntil:
                visible: "Amount [A-Z]+|Select your region"
                timeout: 10000
# The fiat field renders above the crypto one ("Amount BTC"), so it is match 0.
- extendedWaitUntil:
    visible:
      text: ${"Amount " + FIAT_CODE}
      index: 0
    timeout: 1000
- tapOn:
    text: ${"Amount " + FIAT_CODE}
    index: 0
# The Buy scene remembers the last amount; clear it or inputText appends.
- eraseText: 20
- inputText: ${BUY_AMOUNT}
