# common/select-swap-pair.yaml: open the Exchange scene with the pair selected →
# enter fiat amount → Next → wait for a quote → optionally force a provider.
# Assumes logged-in app (compose login-if-needed + dismiss-startup-modals first).
# The pair is set with one deep link, `edge://exchange/swap?sellAsset=..&buyAsset=..`,
# which works from any scene. The wallet pickers below it run only for a side
# the link did not settle.
# PARAMS:
#   SRC_ASSET / DST_ASSET:    deep-link asset: a plugin id (`bitcoin`) or
#                             `<pluginId>_<tokenId>` (`ethereum_0xa0b8..`).
#                             Default bitcoin / ethereum. A side named only by
#                             SRC_WALLET / DST_WALLET is left out of the link
#                             and picked by name instead.
#   MANUAL_PATH:              "true" skips the link: Exchange tab, then both
#                             wallet pickers. For a task whose change is on the
#                             tab bar, the Exchange entry or the wallet picker.
#   SRC_WALLET / DST_WALLET — plain text typed into "Search Wallets" (e.g.
#                             "My Bitcoin"); the first filtered row is picked.
#                             Used on the manual path, for a side with no asset
#                             param, and when the link raises the app's picker
#                             (the account holds several wallets for the asset)
#   SRC_ROW_ID / DST_ROW_ID — id (a regex) of the picker row to tap after
#                             the search text is typed. Default
#                             `walletPickerRow\..*`, the first filtered row.
#                             Pass `walletPickerRow.<wallet name>.<code>`
#                             (e.g. `walletPickerRow.My Bitcoin 3.BTC`) when
#                             the search text matches more than one row.
#   FIAT_AMOUNT             — fiat number typed into the amount field
#   PROVIDER                — exact provider name to force (e.g. "Maya Protocol").
#                             Forcing works by SELECTING it in the provider sheet;
#                             note Preferred/preferPluginId do NOT pin — engine
#                             reverts to best-rate ~60s. For a HARD pin, disable
#                             competitors LOCALLY in the worktree's corePlugins.ts
#                             `swapPlugins` map (set them false) per build-and-test
#                             `force-swap-provider-locally` — NOT in-app Settings >
#                             Exchange, which is account-synced and thrashes under
#                             parallel sessions.
# GOTCHA: amount field retains prior text — eraseText before input.
# EVERY TAP THAT LEAVES A SCENE is followed by a 5s check that the scene moved,
# before any longer wait on the slow thing.
# QUOTE WAIT: ends on "Powered by .*" (a quote) or "Exchange Error" (every
# provider rejected the pair or amount), 25s ceiling; the flow fails on the
# error card. To capture a rejection on purpose, stop the caller's own steps
# at Next and wait for "Exchange Error" there.
# 2026-07-24 consolidation: added the "Search Wallets" step both wallet-picker
# blocks were missing — 5 corpus flows across 3 sessions independently
# re-derived this whole file from scratch because waiting for the wallet text
# directly (no search/filter) times out once the account holds more than a
# screenful of wallets. No caller impact (grepped: zero live runFlow callers).
appId: ${APP_ID}
env:
  APP_ID: co.edgesecure.app
  # `${KEY || default}` so a caller's runFlow env wins over the default.
  # The asset lines come first: they read whether the caller named a wallet
  # (`typeof`, because an unset name is not declared yet at that point).
  SRC_ASSET: '${SRC_ASSET || (typeof SRC_WALLET === "string" && SRC_WALLET ? "" : "bitcoin")}'
  DST_ASSET: '${DST_ASSET || (typeof DST_WALLET === "string" && DST_WALLET ? "" : "ethereum")}'
  MANUAL_PATH: ${MANUAL_PATH || ""}
  SRC_WALLET: ${SRC_WALLET || "Bitcoin"}
  DST_WALLET: ${DST_WALLET || "Ethereum"}
  SRC_ROW_ID: ${SRC_ROW_ID || "walletPickerRow\\..*"}
  DST_ROW_ID: ${DST_ROW_ID || "walletPickerRow\\..*"}
  FIAT_AMOUNT: ${FIAT_AMOUNT || "16"}
  PROVIDER: ${PROVIDER || ""}
---
- runFlow:
    when:
      true: ${MANUAL_PATH != 'true'}
    commands:
      - openLink: "edge://exchange/swap?sellAsset=${SRC_ASSET}&buyAsset=${DST_ASSET}"
      - extendedWaitUntil:
          visible: "Select Source Wallet|Select Receiving Wallet|I have"
          timeout: 30000
      # The link returns before the scene settles on the linked pair.
      - waitForAnimationToEnd:
          timeout: 5000
- runFlow:
    when:
      true: ${MANUAL_PATH == 'true'}
    commands:
      - extendedWaitUntil:
          visible: "Exchange"
          timeout: 30000
      # The tab bar stays hidden for up to ~20s after login while "Exchange" is
      # already in the hierarchy, so retry the tap until the Exchange scene shows.
      - retry:
          maxRetries: 3
          commands:
            - tapOn: "Exchange"
            - extendedWaitUntil:
                visible: "Select Source Wallet|I have"
                timeout: 10000
- runFlow:
    when:
      visible: "Select Source Wallet"
    commands:
      - tapOn: "Select Source Wallet"
      - extendedWaitUntil:
          visible: "Search Wallets"
          timeout: 5000
      - tapOn: "Search Wallets"
      - inputText: ${SRC_WALLET}
      - runFlow:
          when:
            visible: "Not Now"
          commands:
            - tapOn: "Not Now"
      # Rows are picked by id, never by label: a row's label is balance and
      # wallet name ("ETH 0 $2,694 My Ether"), which need not contain the
      # search text ("Ethereum") that filtered it in.
      - extendedWaitUntil:
          visible:
            id: ${SRC_ROW_ID}
            index: 0
          timeout: 15000
      - tapOn:
          id: ${SRC_ROW_ID}
          index: 0
      # Scene-advanced check: a pick that landed settles this side. (The app
      # may raise the other side's picker at once, so "Search Wallets" can
      # still be on screen.)
      - extendedWaitUntil:
          notVisible: "Select Source Wallet"
          timeout: 5000
- runFlow:
    when:
      visible: "Select Receiving Wallet"
    commands:
      - tapOn: "Select Receiving Wallet"
      - extendedWaitUntil:
          visible: "Search Wallets"
          timeout: 5000
      - tapOn: "Search Wallets"
      - inputText: ${DST_WALLET}
      - runFlow:
          when:
            visible: "Not Now"
          commands:
            - tapOn: "Not Now"
      # Rows are picked by id, never by label: a row's label is balance and
      # wallet name ("ETH 0 $2,694 My Ether"), which need not contain the
      # search text ("Ethereum") that filtered it in.
      - extendedWaitUntil:
          visible:
            id: ${DST_ROW_ID}
            index: 0
          timeout: 15000
      - tapOn:
          id: ${DST_ROW_ID}
          index: 0
      # Scene-advanced check: a pick that landed settles this side. (The app
      # may raise the other side's picker at once, so "Search Wallets" can
      # still be on screen.)
      - extendedWaitUntil:
          notVisible: "Select Receiving Wallet"
          timeout: 5000
- extendedWaitUntil:
    visible: "Tap to edit"
    timeout: 15000
- tapOn:
    text: "Tap to edit"
    index: 0
- eraseText
- inputText: ${FIAT_AMOUNT}
# The scene rejects an amount above the wallet balance inline ("Insufficient
# Funds") and disables Next; a tap on it then does nothing. Fail here with the
# reason named, before the tap. (A 2s wait, not assertNotVisible: the assert
# holds for 17s before it fails.)
- extendedWaitUntil:
    notVisible: "Insufficient Funds"
    timeout: 2000
- tapOn: "Next"
# Scene-advanced check: a Next tap that landed raises the "Hang tight" search
# scene at once (or already shows its result), so a swallowed tap fails here in
# 5s instead of running out the quote clock.
- extendedWaitUntil:
    visible: "Hang tight|Powered by .*|Exchange Error"
    timeout: 5000
# One wait for both outcomes, so a rejected quote ends it as fast as a quote
# does; the step after it fails within 1s when the error card is what showed.
- extendedWaitUntil:
    visible: "Powered by .*|Exchange Error"
    timeout: 25000
- extendedWaitUntil:
    visible: "Powered by .*"
    timeout: 1000
- runFlow:
    when:
      true: ${PROVIDER != ''}
    commands:
      - runFlow:
          when:
            notVisible: ${PROVIDER}
          commands:
            - tapOn:
                text: "Powered by .*"
            - extendedWaitUntil:
                visible: "Select Swap Provider"
                timeout: 10000
            - tapOn:
                text: ${PROVIDER}
            # Scene-advanced check: a pick that landed closes the sheet.
            - extendedWaitUntil:
                notVisible: "Select Swap Provider"
                timeout: 5000
            - extendedWaitUntil:
                visible: "Powered by .*|Exchange Error"
                timeout: 25000
            - extendedWaitUntil:
                visible: "Powered by .*"
                timeout: 1000
