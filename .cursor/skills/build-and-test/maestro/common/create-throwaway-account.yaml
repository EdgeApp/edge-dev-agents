# common/create-throwaway-account.yaml — create a fresh, empty Edge account to
# test on, so a test never mutates a shared roster account's synced state
# (activePromotions, referral/attribution writes, Exchange Settings, wallets).
#
# ENTRY STATE: the LOGIN scene (the one with Username / Password / "Create
# account"). On a slot sim the app auto-logs-in, so get there first:
#   1. null BOTH "YOLO_USERNAME" and "YOLO_PIN" in the worktree config.json
#      (nulling only the username hits a light-account fallback that still
#      auto-logs-in), then `simctl terminate` + `launch`
#   2. the app lands on the PIN scene for the last account — this flow taps
#      "Exit PIN" for you to reach the login scene
# AFTER: point YOLO_USERNAME/YOLO_PIN at the new account so relaunches
# auto-login into it, and restore the roster account when the test is done.
#
# NEVER `launchApp: clearState: true` (what the gui repo's maestro/common/
# create-account.yaml does): that wipes the app DATA container, which is where
# the sim's roster accounts live. They cannot be recreated from a PIN.
#
# PARAMS
#   NEW_USERNAME  default "agent-tw-<random>"; must be unused
#   NEW_PASSWORD  default is random per run and meets the requirements (10+
#                 chars, upper, lower, digit); it stays in
#                 output.newAccountPassword for delete-throwaway-account.yaml
#   NEW_PIN       default "1234" (deliberately outside the roster PIN space)
#   NEW_WALLETS   JSON array of wallet names to end up with, e.g.
#                 '["Ethereum"]'. "" (default) keeps the app's default set.
#   DEFAULT_WALLETS  the app's own default toggles, used to compute the diff
#   VERIFY_ACCOUNT_INFO  "true" expands the review dropdown and asserts the
#                 username/password/PIN echo back. Default off: it is the gui
#                 suite's job, and the assert chain is the brittlest part.
#
# OUTPUTS (for composing common/delete-throwaway-account.yaml)
#   output.newAccountUsername / output.newAccountPassword / output.newAccountPin
#
# NOTES
# - Every text field is eraseText'd before inputText. Typing into the Confirm
#   Password field without erasing left it longer than the first field and
#   "Passwords must match" never went green.
# - The Set Password scene's Next button sits under the keyboard, and
#   `hideKeyboard` SIGABRTs this debug build, so it is submitted with Enter.
# - The captcha (ALTCHA) and the modal gauntlet are all conditional here. The
#   gui suite asserts them; a dev flow that hard-asserts them breaks whenever
#   the copy or the captcha rollout changes.
# - Every wait over 20s sits behind a short scene-advanced check, so a swallowed
#   tap fails in seconds at the tap, not minutes later at the slow wait.
# - Script state lives on `output`, never in `var`: the Maestro CLI runs each
#   evalScript in its own scope, so a `var` from one step is undefined in the
#   next. The wallet diff is computed before the account exists, so a bad
#   NEW_WALLETS value fails with nothing to clean up.
appId: ${APP_ID}
env:
  APP_ID: co.edgesecure.app
  # The `X || default` form is REQUIRED on every overridable param: a subflow's
  # own `env:` block SHADOWS the value a parent `runFlow: env:` passes in
  # (maestro 2.x on this host), so a bare default silently wins over the caller.
  NEW_USERNAME: ${NEW_USERNAME || "agent-tw-" + Math.floor(Math.random() * 1000000000)}
  NEW_PASSWORD: ${NEW_PASSWORD || "Tw" + Math.random().toString(36).slice(2, 10).padEnd(8, "x") + "A1"}
  NEW_PIN: ${NEW_PIN || "1234"}
  NEW_WALLETS: ${NEW_WALLETS || ""}
  DEFAULT_WALLETS: ${DEFAULT_WALLETS || '["Bitcoin", "Ethereum", "Litecoin", "Bitcoin Cash", "Dash"]'}
  VERIFY_ACCOUNT_INFO: ${VERIFY_ACCOUNT_INFO || ""}
---
- evalScript: ${output.newAccountUsername = NEW_USERNAME}
- evalScript: ${output.newAccountPassword = NEW_PASSWORD}
- evalScript: ${output.newAccountPin = NEW_PIN}
- evalScript: ${output.twWanted = JSON.parse(NEW_WALLETS || "[]")}
- evalScript: ${output.twDefaults = JSON.parse(DEFAULT_WALLETS)}
- evalScript: ${output.twDrop = output.twDefaults.filter(d => NEW_WALLETS !== "" && !output.twWanted.includes(d))}
- evalScript: ${output.twAdd = output.twWanted.filter(w => !output.twDefaults.includes(w))}
- evalScript: ${output.twDropIndex = 0}
- evalScript: ${output.twAddIndex = 0}

# A debug build's LogBox toast covers the bottom of the scene and swallows taps.
- runFlow: dismiss-logbox-banner.yaml

# Reach the login scene from wherever the app landed.
- runFlow:
    when:
      visible: "Exit PIN"
    commands:
      - tapOn: "Exit PIN"
      - waitForAnimationToEnd:
          timeout: 8000
- runFlow:
    when:
      visible: "Already have an account\\? Sign in"
    commands:
      - tapOn: "Already have an account\\? Sign in"
      - waitForAnimationToEnd:
          timeout: 8000
- extendedWaitUntil:
    visible: "Create account"
    timeout: 20000
- tapOn: "Create account"
# Scene-advanced check: the login scene's password field is gone.
- extendedWaitUntil:
    notVisible:
      id: "passwordFormField"
    timeout: 10000

# Choose Username. The captcha may or may not appear; it self-solves.
- extendedWaitUntil:
    visible: "Choose Username"
    timeout: 45000
- waitForAnimationToEnd:
    timeout: 10000
- tapOn: "Username"
- eraseText: 40
- inputText: ${NEW_USERNAME}
- extendedWaitUntil:
    visible: "Username available"
    timeout: 30000
- tapOn: "Next"
- waitForAnimationToEnd:
    timeout: 8000

# Set Password. Both fields, then Enter (Next is behind the keyboard).
- extendedWaitUntil:
    visible: "Set Password"
    timeout: 20000
- tapOn: "Password"
- eraseText: 40
- inputText: ${NEW_PASSWORD}
- tapOn: "Confirm Password"
- eraseText: 40
- inputText: ${NEW_PASSWORD}
- waitForAnimationToEnd:
    timeout: 4000
- assertVisible: "Passwords must match"
- pressKey: Enter
- waitForAnimationToEnd:
    timeout: 6000

# Set PIN.
- extendedWaitUntil:
    visible: "Set PIN"
    timeout: 20000
- inputText: ${NEW_PIN}
- waitForAnimationToEnd:
    timeout: 5000
- tapOn: "Next"
- waitForAnimationToEnd:
    timeout: 8000

# Terms of Use: four circles. Anchored on short prefixes so a copy edit to the
# tail of any clause does not break the flow.
- extendedWaitUntil:
    visible: "Review: Terms of Use.*"
    timeout: 20000
- tapOn: "I understand that my funds are held securely.*"
- tapOn: "I understand that if I lose this device.*"
- tapOn: "I understand that if I lose my username.*"
- tapOn: "I understand that I am responsible.*"
- waitForAnimationToEnd:
    timeout: 5000
- tapOn: "Confirm"
# Scene-advanced check: the terms scene is gone.
- extendedWaitUntil:
    notVisible: "Review: Terms of Use.*"
    timeout: 10000

# Account creation runs on the server; the Create button fades in after.
# One wait for both endings: a creation the server did not complete drops the
# app back on the terms scene (with an error toast), so that scene ends the
# wait too and the step after it fails within 1s.
- extendedWaitUntil:
    visible: "View account information.*|Review: Terms of Use.*"
    timeout: 90000
- extendedWaitUntil:
    visible: "View account information.*"
    timeout: 1000
- runFlow:
    when:
      true: ${VERIFY_ACCOUNT_INFO}
    commands:
      - tapOn: "View account information.*"
      - assertVisible: ${NEW_USERNAME}
      - assertVisible: ${NEW_PASSWORD}
      - assertVisible: ${NEW_PIN}
# The Create button FADES IN, and a tap during the fade is swallowed with no
# error — the flow reads COMPLETED and the scene never advances. Settle first,
# then tap again if the Review scene is still up.
- waitForAnimationToEnd:
    timeout: 8000
- tapOn: "Create"
- extendedWaitUntil:
    notVisible: "Tap the dropdown below to review your account information"
    timeout: 5000
    optional: true
- runFlow:
    when:
      visible: "Tap the dropdown below to review your account information"
    commands:
      - tapOn: "Create"
- extendedWaitUntil:
    notVisible: "Tap the dropdown below to review your account information"
    timeout: 10000

# iOS shows the notification-permission modal before the wallet picker.
- extendedWaitUntil:
    visible: "Security is Our Priority|Choose Wallets to Add"
    timeout: 20000
- runFlow:
    when:
      visible: "Security is Our Priority"
    commands:
      - tapOn: "Cancel"
      - extendedWaitUntil:
          notVisible: "Security is Our Priority"
          timeout: 10000

# Wallet picker. With NEW_WALLETS unset the app's defaults are kept.
- extendedWaitUntil:
    visible: "Choose Wallets to Add"
    timeout: 45000
- runFlow:
    when:
      true: ${NEW_WALLETS}
    commands:
      - repeat:
          times: ${output.twDrop.length}
          commands:
            - tapOn: ${".*" + output.twDrop[output.twDropIndex]}
            - evalScript: ${output.twDropIndex++}
      - repeat:
          times: ${output.twAdd.length}
          commands:
            - tapOn: "Search Wallets"
            - eraseText: 30
            - inputText: ${output.twAdd[output.twAddIndex]}
            - tapOn:
                text: ${".*" + output.twAdd[output.twAddIndex]}
                index: 1
            - evalScript: ${output.twAddIndex++}
- tapOn:
    id: "nextButton"
# The Next tap can be swallowed with no error. Prove the picker closed before
# the long wallet-creation wait: a short check, one retry, then a hard gate.
- extendedWaitUntil:
    notVisible:
      id: "nextButton"
    timeout: 5000
    optional: true
- runFlow:
    when:
      visible:
        id: "nextButton"
    commands:
      - tapOn:
          id: "nextButton"
- extendedWaitUntil:
    notVisible:
      id: "nextButton"
    timeout: 10000

# Landed in the new account. Home mounts at once and shows the balance card
# with or without wallets, so this is the scene check only; it says nothing
# about wallet creation.
# SELECTOR: it must be the `.*Total Balance.*` REGEX. Maestro matches the whole
# text node, and Home renders the balance as one node ("Total Balance $ 0.00
# USD"), so the bare string never matches — it fails at ANY timeout, on a screen
# that plainly shows the words.
- extendedWaitUntil:
    visible: ".*Total Balance.*"
    timeout: 20000
- runFlow:
    when:
      visible: "How Did You Discover Edge\\?"
    commands:
      - tapOn: "Dismiss"
- runFlow:
    when:
      visible: "Security is Our Priority"
    commands:
      - tapOn: "Cancel"
# Wallet creation runs in the background after Home mounts (70s-3min on a slot
# sim) and Home looks the same whether it worked. The Assets tab shows the
# outcome: a wallet row ("My <asset>") when the first wallet lands, or the
# lasting "Alert!" dropdown the app raises when a key call fails. One wait for
# both endings; the step after it fails within 1s when the alert is what showed.
# Skipped when the caller asked for no wallets.
- runFlow:
    when:
      true: ${NEW_WALLETS === "" || output.twWanted.length > 0}
    commands:
      - tapOn: "Assets"
      # Scene-advanced check: the wallet list's search footer.
      - extendedWaitUntil:
          visible: ".*Search Wallets.*"
          timeout: 10000
      - extendedWaitUntil:
          visible: "My .*|.*Alert!.*"
          timeout: 300000
      - extendedWaitUntil:
          visible: "My .*"
          timeout: 1000
      - tapOn: "Home"
- extendedWaitUntil:
    visible: ".*Total Balance.*"
    timeout: 10000
