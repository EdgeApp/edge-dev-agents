# common/dismiss-startup-modals.yaml — clear the post-login modal gauntlet.
# Each block is conditional, so this is safe to run any time modals MIGHT appear
# (after login, after relaunch). Compose via:  - runFlow: common/dismiss-startup-modals.yaml
appId: ${APP_ID}
env:
  APP_ID: co.edgesecure.app
---
# A debug build's LogBox toast covers the tab bar and swallows taps there.
- runFlow: dismiss-logbox-banner.yaml
# "Verify your password" (PasswordReminderModal) covers the scene when the
# account is due a password check, and can also open when a tap meant for
# something else lands on the password notification card. Its close button
# postpones the check without touching the password.
- runFlow:
    when:
      visible: "Verify your password"
    commands:
      - tapOn:
          id: "modal-close-button"
      - waitForAnimationToEnd:
          timeout: 2500
- runFlow:
    when:
      visible: "Security is Our Priority"
    commands:
      - tapOn: "Cancel"
# The title is a regex to the Maestro CLI, so the "?" is escaped.
- runFlow:
    when:
      visible: "How Did You Discover Edge\\?"
    commands:
      - tapOn: "Dismiss"
# Notification-permission and survey prompts that end in "Not Now" or "Later".
- runFlow:
    when:
      visible: "Not Now"
    commands:
      - tapOn: "Not Now"
- runFlow:
    when:
      visible: "Later"
    commands:
      - tapOn: "Later"
