# common/login-if-needed.yaml — PIN-login ONLY when the PIN screen is showing.
# Safe under YOLO auto-login (app usually lands already logged in: the gate makes
# this a no-op) and after a relaunch that returns to the PIN screen.
# PARAMS: PIN_DIGIT (single digit tapped 4x; every roster PIN is one digit
#   repeated, so pass that digit; look the PIN up by role in
#   ~/.config/edge-secrets/test-accounts.json).
# GOTCHA: taps MUST stay spaced (waitToSettleTimeoutMs) — fast taps drop digits →
# wrong PIN → exponential lockout. Never tighten these.
# YOLO auto-login can finish mid-entry and leave the PIN screen, so each tap
# is gated on the PIN screen still showing.
appId: ${APP_ID}
env:
  APP_ID: co.edgesecure.app
  # `${KEY || default}` so a caller's runFlow env wins over the default.
  PIN_DIGIT: ${PIN_DIGIT || "0"}
---
- runFlow:
    when:
      visible: "Exit PIN"
    commands:
      - tapOn:
          text: ${PIN_DIGIT}
          waitToSettleTimeoutMs: 900
- runFlow:
    when:
      visible: "Exit PIN"
    commands:
      - tapOn:
          text: ${PIN_DIGIT}
          waitToSettleTimeoutMs: 900
- runFlow:
    when:
      visible: "Exit PIN"
    commands:
      - tapOn:
          text: ${PIN_DIGIT}
          waitToSettleTimeoutMs: 900
- runFlow:
    when:
      visible: "Exit PIN"
    commands:
      - tapOn:
          text: ${PIN_DIGIT}
          waitToSettleTimeoutMs: 1500
