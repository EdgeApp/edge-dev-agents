# common/delete-throwaway-account.yaml — delete the account that is currently
# logged in, so a throwaway created by common/create-throwaway-account.yaml does
# not accumulate on the sim image (every leftover account shows up in the login
# scene's dropdown forever).
#
# ENTRY STATE: logged into the account you want gone, on a scene with the
# header menu button, or on the create flow's "Choose Wallets to Add" picker
# (where a create run that stopped early leaves the app; the picker has no
# header, so this flow leaves it first). Deletion is irreversible; never point
# this at a roster account (any username in
# ~/.config/edge-secrets/test-accounts.json).
#
# PARAMS
#   DELETE_USERNAME  defaults to output.newAccountUsername (set by the create flow)
#   DELETE_PASSWORD  defaults to output.newAccountPassword
#
# NOTE: the gui repo's maestro/common/delete-account.yaml confirms via
# `pasteText`. The iOS "Edge would like to paste" permission dialog wedges the
# XCUITest hierarchy fetch, so this flow types the username instead.
appId: ${APP_ID}
env:
  APP_ID: co.edgesecure.app
  # The `X || ...` fallback is REQUIRED, not decoration: a subflow's own `env:`
  # block SHADOWS the value a parent `runFlow: env:` passes in (maestro 2.x on
  # this host). Without it a caller-supplied DELETE_PASSWORD is ignored and the
  # modal is typed the literal string "undefined".
  DELETE_USERNAME: ${DELETE_USERNAME || output.newAccountUsername}
  DELETE_PASSWORD: ${DELETE_PASSWORD || output.newAccountPassword}
---
- runFlow: dismiss-logbox-banner.yaml
- runFlow:
    when:
      visible: "Choose Wallets to Add"
    commands:
      - tapOn:
          id: "nextButton"
      - extendedWaitUntil:
          notVisible:
            id: "nextButton"
          timeout: 10000
      # Home mounts at once, with or without wallets.
      - extendedWaitUntil:
          visible: ".*Total Balance.*"
          timeout: 20000
# Entry gate: a scene without the header menu button fails here by name.
- extendedWaitUntil:
    visible:
      id: "sideMenuButton"
    timeout: 15000
# An error alert (a failed wallet creation raises one) lies over the header and
# takes the menu tap, so it is closed first.
- runFlow:
    when:
      visible:
        id: "alertDropdownClose"
    commands:
      - tapOn:
          id: "alertDropdownClose"
      - extendedWaitUntil:
          notVisible:
            id: "alertDropdownClose"
          timeout: 5000
- tapOn:
    id: "sideMenuButton"
- extendedWaitUntil:
    visible: "Settings"
    timeout: 15000
- tapOn: "Settings"
- extendedWaitUntil:
    visible: "Delete Account"
    timeout: 20000
    optional: true
- scrollUntilVisible:
    element: "Delete Account"
- tapOn: "Delete Account"

# Password gate. The field must be tapped and erased first: typing straight
# after the modal opens drops characters and lands on "Invalid Password".
- extendedWaitUntil:
    visible: "Enter your password"
    timeout: 15000
- tapOn: "Enter your password"
- eraseText: 40
- inputText: ${DELETE_PASSWORD}
- waitForAnimationToEnd:
    timeout: 4000
- tapOn: "Submit"

# Confirmation: agree, then retype the username.
- extendedWaitUntil:
    visible: "I understand and agree to the terms"
    timeout: 20000
- tapOn: "I understand and agree to the terms"
- tapOn: "Confirm & Finish"
- extendedWaitUntil:
    visible: ${".*" + DELETE_USERNAME + ".*"}
    timeout: 20000
- inputText: ${DELETE_USERNAME}
- pressKey: Enter
# The modal stays up while the server deletes the account, so no short check
# can tell a swallowed Enter from a deletion in progress. The wait is short
# instead (deletion takes about 2s) and names both endings; the assert turns
# the failure ending into a failed step.
- extendedWaitUntil:
    visible: ${"Account " + DELETE_USERNAME + " deleted|Username does not match"}
    timeout: 20000
- assertVisible: ${"Account " + DELETE_USERNAME + " deleted"}
